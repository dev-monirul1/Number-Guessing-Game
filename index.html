<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- first page  -->
     <div id="firstPage">
        <h1 id="firstPageHead">Wanna Play Game</h1>
        <input id="firstNameInput" type="text" placeholder="What is your name">
         <button id="firstNameBtn">Start Game</button>
        <h2 id="firstNameError" hidden>Name is Missing</h2>
     </div>
    <!-- first page  -->

     <!-- second page  -->
     <div id="secondPage" hidden>
        <h1 id="secondPageHead">Player-1</h1>
        <input id="firstNumberInput" type="text" placeholder="Give a number">
         <button id="firstNumberBtn">Let's Play</button>
        <h2 id="firstNumberError" hidden>Please give a number</h2>
     </div>
    <!-- second page  -->

    <!-- third page -->
     <div id="thirdPage" hidden >
        <h1 id="thirdPageHead">Player-2 Name</h1>
        <input id="secondNameInput" type="text" placeholder="What is your name">
        <button id="secondNameBtn">Start Game</button>
        <h2 id="secondNameError" hidden>Name is Missing</h2>
     </div>
    <!-- third page -->

    <!-- fourth page -->
     <div id="fourthPage" hidden >
        <h1 id="fourthPageHead">Player-2</h1>
        <input id="secondNumberInput" type="text" placeholder="Give a number">
        <button id="secondNumberBtn">Let's Guess The Number</button>
        <h2 id="secondNumberError"  hidden>Please give a number</h2>
     </div>
    <!-- fourth page -->

    <!-- final page  -->
     <div id="curret"hidden>
        <h1 id="curretText">Number is Matched</h1>
     </div>
     <div id="wrong" hidden>
        <h1 id="wrongText">Number is Not Matched</h1>
     </div>
    <!-- final page  -->



    <script src="./js/script.js"></script>
</body>
</html>
